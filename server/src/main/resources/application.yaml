spring:
  application:
    name: outpost
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${OUTPOST_DB_URL:jdbc:postgresql://localhost:5432/outpost}
    username: ${OUTPOST_DB_USER:outpost}
    password: ${OUTPOST_DB_PASSWORD:outpost}
  servlet:
    multipart:
      # sentry-cli chunk upload (§4.4): 8 MiB chunks, 64/request, 32 MiB request cap.
      max-file-size: 9MB
      max-request-size: 34MB

outpost:
  # Public base URL of this instance; used to render DSNs in the UI.
  public-url: ${OUTPOST_PUBLIC_URL:http://localhost:8080}
  ingest:
    # Gzipped envelopes use the wire cap before decoding and the decompressed cap
    # afterward. Uncompressed envelopes use the smaller of the two caps.
    max-envelope-wire-bytes: ${OUTPOST_INGEST_MAX_ENVELOPE_WIRE_BYTES:4194304}
    max-envelope-decompressed-bytes: ${OUTPOST_INGEST_MAX_ENVELOPE_DECOMPRESSED_BYTES:20971520}
  retention:
    event-chunk-size: ${OUTPOST_RETENTION_EVENT_CHUNK_SIZE:10000}
    chunk-timeout-seconds: ${OUTPOST_RETENTION_CHUNK_TIMEOUT_SECONDS:30}
  admin:
    email: ${OUTPOST_ADMIN_EMAIL:}
    password: ${OUTPOST_ADMIN_PASSWORD:}

management:
  server:
    # Actuator moves off the public port: SecurityConfig ends in permitAll, so
    # /actuator/** on 8080 would be world-readable. docker-compose does not
    # publish this port. The liveness/readiness groups below pin themselves back
    # to the main port via `additional-path: server:`, so probes are unaffected.
    # 9090 rather than the conventional 8081, which docker-compose already binds
    # to demo-backend — bootRun with the demo profile up would fail to start.
    port: ${OUTPOST_MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          additional-path: server:/healthz
        readiness:
          additional-path: server:/readyz
          include: readinessState,db
