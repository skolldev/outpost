plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.outpost'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc:2.0.1'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	// The benchmarks are wall-clock and minutes long — opt in via `ingestBenchmark`
	// or `retrievalBenchmark`. The pass/fail half of both questions lives in tagless
	// tests that do run here: IngestBackpressureIntegrationTest for shedding, and
	// dev.outpost.query's *PerformanceTest guards for retrieval.
	useJUnitPlatform {
		excludeTags 'benchmark'
	}
}

/**
 * Shared configuration for the opt-in benchmark tasks. Both want the same heap,
 * the same logging and the same refusal to be cached; only the tag selector and
 * the properties they forward differ.
 */
def benchmarkTask = { String name, String tags, String description, List<String> properties ->
	tasks.register(name, Test) {
		it.description = description
		group = 'verification'
		testClassesDirs = sourceSets.test.output.classesDirs
		classpath = sourceSets.test.runtimeClasspath
		useJUnitPlatform {
			includeTags tags
		}
		// Gradle's 512 MB default is not a realistic server heap, and it matters more
		// than it looks: the ingest workers still materialize one envelope at a time
		// while digesting it, and that benchmark measures allocation rather than only
		// retained heap. Override with -Pbench.heap=4g for larger experiments.
		maxHeapSize = project.findProperty('bench.heap') ?: '2g'
		// Always rerun: the point is a fresh measurement, not a cached verdict.
		outputs.upToDateWhen { false }
		testLogging {
			showStandardStreams = true
			exceptionFormat = 'full'
		}
		properties.each { property ->
			if (project.hasProperty("bench.${property}")) {
				systemProperty "outpost.bench.${property}", project.property("bench.${property}")
			}
		}
	}
}

// -Pbench.target=http://host:8080 drives a real deployment instead of the
// embedded app; -Pbench.projectId / -Pbench.key name the DSN to post to.
benchmarkTask('ingestBenchmark', 'benchmark & ingest',
		'Opt-in ingest load benchmark. Not run by `build`. Requires Docker.',
		['target', 'projectId', 'key'])

// -Pbench.scale=0.1 seeds a tenth of the default dataset; ~5 minutes, most of it
// the fixed per-scenario measurement window rather than the seed.
benchmarkTask('retrievalBenchmark', 'benchmark & retrieval',
		'Opt-in retrieval latency benchmark. Not run by `build`. Requires Docker.',
		['scale'])
