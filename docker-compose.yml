# docker-compose.yml — the whole product: Outpost + Postgres.
# App entry: http://localhost:8080 — UI, browser API and SDK ingest all share it.
services:
  outpost: # UI + API in one image (name kept: demo services reference outpost:8080)
    build: .
    image: outpost/outpost:latest
    ports: ["8080:8080"]
    environment:
      OUTPOST_DB_URL: jdbc:postgresql://db:5432/outpost
      OUTPOST_DB_USER: outpost
      OUTPOST_DB_PASSWORD: outpost
      OUTPOST_PUBLIC_URL: http://localhost:8080 # DSN base shown in UI
      OUTPOST_ADMIN_EMAIL: admin@local
      OUTPOST_ADMIN_PASSWORD: change-me
    # Docker's default is 10s, which SIGKILLs the process mid-drain. Covers the
    # 25s ingest drain plus the 30s per-phase lifecycle timeout around it.
    stop_grace_period: 60s
    # No compose healthcheck: the runtime image is distroless, so there is no
    # shell or curl to probe with. Orchestrators use the HTTP /healthz and
    # /readyz endpoints instead (see the README's Kubernetes example).
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:17-alpine
    ports: ["5432:5432"] # published for local backend development (./gradlew bootRun)
    environment: { POSTGRES_DB: outpost, POSTGRES_USER: outpost, POSTGRES_PASSWORD: outpost }
    volumes: ["outpost-pg:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U outpost"], interval: 5s }

  # ── Demo apps (docker compose --profile demo up -d --build) ────────────────
  # Sentry-SDK-instrumented shop that sends real errors/logs/traces to Outpost.
  # demo-seed creates the two projects + DSN keys the apps need; see demo/README.md.

  # One-shot: waits for Flyway to migrate (the schema does not exist at Postgres
  # initdb time, so this cannot be an /docker-entrypoint-initdb.d script), then
  # applies demo-setup.sql — but only when the demo projects are missing, since
  # that script is a destructive reset and `up` would otherwise wipe the
  # telemetry you just generated. Logs the resolved DSNs either way.
  demo-seed:
    image: postgres:17-alpine # for psql; never serves anything
    profiles: ["demo"]
    restart: "no"
    environment: { PGPASSWORD: outpost }
    volumes: ["./demo/scripts:/demo:ro"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        psql() { command psql -h db -U outpost -d outpost "$$@"; }
        echo "waiting for Outpost's Flyway migration to create the schema..."
        for i in $$(seq 1 120); do
          [ "$$(psql -Atc "SELECT to_regclass('public.project')")" = project ] && break
          [ "$$i" = 120 ] && { echo "timed out waiting for the schema"; exit 1; }
          sleep 1
        done
        if [ "$$(psql -Atc "SELECT count(*) FROM project WHERE slug IN ('shop-frontend','shop-backend')")" = 2 ]; then
          echo "demo projects already exist — keeping them and their telemetry"
          echo "(to reset: docker compose exec -T db psql -U outpost -d outpost < demo/scripts/demo-setup.sql)"
        else
          psql -v ON_ERROR_STOP=1 -f /demo/demo-setup.sql
        fi
        psql -Atc "SELECT p.slug || ' (project ' || p.id || '): http://' || k.public_key || '@localhost:8080/' || p.id
                   FROM project p JOIN project_key k ON k.project_id = p.id AND k.is_active
                   WHERE p.slug IN ('shop-frontend','shop-backend') ORDER BY p.slug"
    depends_on:
      db: { condition: service_healthy }
      outpost: { condition: service_started }

  demo-backend:
    build: { context: demo/backend }
    image: outpost/demo-backend:latest
    profiles: ["demo"]
    ports: ["8081:8081"]
    environment:
      # In-network DSN host: ingest never validates the host, only key+project id.
      DEMO_SENTRY_DSN: http://cccccccccccccccccccccccccccccccc@outpost:8080/${DEMO_BACKEND_PROJECT_ID:-2}
      DEMO_SENTRY_ENVIRONMENT: ${DEMO_SENTRY_ENVIRONMENT:-dev}
      DEMO_SENTRY_RELEASE: shop-backend@2.2.0
      DEMO_SELF_URL: http://demo-backend:8081
      DEMO_CORS_ORIGINS: http://localhost:4300
      DEMO_TRAFFIC: ${DEMO_TRAFFIC:-true}
    depends_on:
      outpost: { condition: service_started }
      demo-seed: { condition: service_completed_successfully }

  demo-frontend:
    build: { context: demo/frontend }
    image: outpost/demo-frontend:latest
    profiles: ["demo"]
    ports: ["4300:80"]
    environment:
      # Browser-side values → host-published ports, NOT compose service names.
      DEMO_SENTRY_DSN: http://aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@localhost:8080/${DEMO_FRONTEND_PROJECT_ID:-1}
      DEMO_SENTRY_ENVIRONMENT: ${DEMO_SENTRY_ENVIRONMENT:-dev}
      DEMO_SENTRY_RELEASE: shop-frontend@1.5.0
      DEMO_API_BASE: http://localhost:8081
      # Container-side URL for the entrypoint's source map self-upload; set
      # SENTRY_AUTH_TOKEN (artifacts:write) to enable symbolication.
      OUTPOST_INTERNAL_URL: http://outpost:8080
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    depends_on:
      outpost: { condition: service_started }
      demo-backend: { condition: service_started }
      demo-seed: { condition: service_completed_successfully }

volumes: { outpost-pg: {} }
