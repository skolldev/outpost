@if (bars().length) {
  <svg
    [attr.viewBox]="'0 0 ' + bucketCount() + ' ' + height"
    preserveAspectRatio="none"
    class="block h-16 w-full cursor-crosshair touch-none select-none"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp()"
    (pointercancel)="onPointerUp()"
  >
    @for (bar of bars(); track bar.start) {
      <g [attr.opacity]="bar.selected ? 1 : 0.25">
        <title>{{ bar.label }}</title>
        <!-- Full-height hit target, so pointing at an empty bucket still selects it. -->
        <rect
          [attr.x]="bar.index"
          y="0"
          [attr.width]="1"
          [attr.height]="height"
          fill="transparent"
        />
        @if (bar.total) {
          @for (segment of bar.segments; track segment.level) {
            <rect
              [attr.x]="bar.index"
              [attr.y]="segment.y"
              [attr.width]="barWidth"
              [attr.height]="segment.h"
              [attr.fill]="segment.fill"
            />
          }
        } @else {
          <rect
            [attr.x]="bar.index"
            [attr.y]="height - 1"
            [attr.width]="barWidth"
            height="1"
            class="fill-border"
          />
        }
      </g>
    }
  </svg>
}
