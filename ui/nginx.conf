# UI config: serves the Angular app and proxies the API same-origin to the
# server. Shipped as an envsubst template
# (/etc/nginx/templates/default.conf.template) — the stock nginx entrypoint
# substitutes ${OUTPOST_API_URL} (e.g. http://outpost:8080) at container start.
# nginx runtime variables ($host, $uri, ...) are untouched because only
# variables present in the environment are substituted.
#
# __BASE__ is the path the app is served under, without a trailing slash, and
# is baked in by the Dockerfile at build time from the BASE_HREF arg — empty
# for the default root deployment, "/outpost" for a sub-path one. It is a plain
# token rather than ${...} so that the runtime envsubst pass keeps owning
# OUTPOST_API_URL alone: the path is a build-time property, the upstream a
# run-time one. A sub-path deployment assumes the ingress routes that prefix
# here WITHOUT stripping it.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Path-only redirects: keeps scheme/host correct behind a TLS-terminating
    # ingress.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Liveness/readiness probe for this container.
    location = /nginx-healthz { return 200 "ok\n"; }

    # @prefix-only-start — stripped at build time for a root deployment, where
    # "location /" already serves "/" and these would loop.
    # Convenience redirects into the app.
    location = /        { return 302 __BASE__/; }
    location = __BASE__ { return 301 __BASE__/; }
    # @prefix-only-end

    # SSE live log tail — exact match wins over the API prefix location below.
    # Streaming must not be buffered; the server heartbeats every 25 s.
    location = __BASE__/api/internal/logs {
        proxy_pass ${OUTPOST_API_URL}/api/internal/logs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # API proxy: __BASE__/api/... -> /api/... — both trailing slashes are
    # load-bearing (proxy_pass replaces the matched prefix). ^~ stops the
    # asset regex below from hijacking API paths.
    location ^~ __BASE__/api/ {
        proxy_pass ${OUTPOST_API_URL}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 40m;  # sentry-cli chunk uploads (server caps at 34 MB)
    }

    # index.html references hashed bundles — always revalidate.
    location = __BASE__/index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed build artifacts (outputHashing: all): cache forever. Deliberately
    # excludes unhashed public/ assets like favicon.ico.
    location ~* ^__BASE__/.+\.(?:js|css|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback for client-side routes.
    location __BASE__/ {
        try_files $uri __BASE__/index.html;
    }
}
